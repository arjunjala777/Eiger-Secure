<ossec_config>
  <client>
    <server><address>CHANGE_MANAGER_IP</address><port>CHANGE_MANAGER_PORT</port><protocol>tcp</protocol></server>
    <config-profile>eiger-blue-team</config-profile>
    <enrollment><enabled>yes</enabled><manager_address>CHANGE_ENROLL_IP</manager_address><port>CHANGE_ENROLL_PORT</port><agent_name>CHANGE_AGENT_NAME</agent_name><server_ca_path>/run/secrets/wazuh_manager_ca</server_ca_path><authorization_pass_path>/run/secrets/wazuh_enrollment_password</authorization_pass_path></enrollment>
  </client>
  <localfile><log_format>json</log_format><location>/var/log/eiger/wazuh_security_events.json</location></localfile>
  <logging><log_format>json</log_format></logging>
</ossec_config>
